##
# /etc/nginx/sites-available/tmq-docs
# Nginx config cho trang tài liệu VitePress — docs.tmq-express.io.vn
##

server {
    listen 80;
    listen [::]:80;
    server_name docs.tmq-express.io.vn;

    # Certbot sẽ tự chuyển thành HTTPS sau khi chạy
    # certbot --nginx -d docs.tmq-express.io.vn

    root /var/www/tmq-docs;
    index index.html;

    # Xử lý SPA routing của VitePress
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache static assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
